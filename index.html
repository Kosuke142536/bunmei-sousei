// ---------- turn flow ----------
function startTurn(who){
  const p = state[who];
  p.energy = p.maxEnergy;
  p.energyUpUsedThisTurn = false;
  p.terrainChangedThisTurn = false;
  p.negateDebuffUsedThisTurn = false;
  p.sakokuUsedThisTurn = false;
  p.fields.f1.tideNegateUsed = false;
  p.fields.f2.tideNegateUsed = false;
  allFieldCards(p).forEach(f=>{ f.sick=false; f.attacked=false; f.playedThisTurn=false; });
  if(p.debuffTurns>0){ p.debuffTurns -= 1; if(p.debuffTurns===0) log(`${p.name}の社会問題は解決した。`); }
  // continuous buildings: 万里の長城タイプの「自分のターン開始時」効果
  allFieldCards(p).forEach(f=>{
    const bd = cardDef(f.cardId);
    if(bd.type==='building' && bd.turnStartHeal){
      p.coreHp = Math.min(START_CORE_HP, p.coreHp + bd.turnStartHeal);
      log(`${p.name}の「${bd.name}」の効果でCoreを${bd.turnStartHeal}回復した。`);
    }
  });
  // persistent policies: re-apply each one's effect at the start of its owner's turn,
  // then tick its duration down; once duration reaches 0 it's destroyed automatically
  const opp = who==='player' ? state.ai : state.player;
  p.policies.forEach(pol=>{
    const pd = cardDef(pol.cardId);
    if(pd.effect && pd.effect.trigger==='play'){
      applyEffect(p, opp, pd.effect);
      log(`${p.name}の政策「${pd.name}」が再発動した。`);
    }
    // アテネの民会: 自分のターン開始時、偉人が2体以上いればカードを1枚引く
    if(hasSpecial(pd,'policy_draw_if_2persons')){
      const personCount = allFieldCards(p).filter(c=>cardDef(c.cardId).type==='person').length;
      if(personCount>=2){
        drawCard(p, 1);
        log(`${p.name}の政策「${pd.name}」の効果でカードを1枚引いた。`);
      }
    }
    // ハンザ同盟: 自分のターン開始時、建物が2つあるごとにカードを1枚引く(最大2回)
    if(hasSpecial(pd,'policy_draw_per_2buildings')){
      const buildingCount = allFieldCards(p).filter(c=>cardDef(c.cardId).type==='building').length;
      const draws = Math.min(2, Math.floor(buildingCount/2));
      if(draws>0){
        drawCard(p, draws);
        log(`${p.name}の政策「${pd.name}」の効果でカードを${draws}枚引いた。`);
      }
    }
    pol.duration -= 1;
  });
  p.policies = p.policies.filter(pol=>{
    if(pol.duration<=0){
      log(`${p.name}の政策「${cardDef(pol.cardId).name}」は持続が尽きて破棄された。`);
      return false;
    }
    return true;
  });
  drawCard(p, 1);
  state.active = who;
  state.selected = null;
  log(`--- ${p.name}のターン${state.turnNumber} ---`);
}

// buildings with a periodic "every 3 turns since played" effect (法隆寺, ケルン大聖堂)
function applyTurnEndBuildingEffects(who){
  const p = state[who];
  allFieldCards(p).forEach(f=>{
    const bd = cardDef(f.cardId);
    if(bd.type!=='building') return;
    f.turnsOnField = (f.turnsOnField||0) + 1;
    if(hasSpecial(bd,'building_periodic_draw') && f.turnsOnField>=3){
      f.turnsOnField = 0;
      drawCard(p, 1);
      log(`${p.name}の「${bd.name}」の千年の伝承でカードを1枚引いた。`);
      const others = allFieldCards(p).filter(c=>c.uid!==f.uid && cardDef(c.cardId).type==='building');
      if(others.length>0 && p.hand.length<HAND_MAX){
        const pick = others[Math.floor(Math.random()*others.length)];
        const loc = findFieldCard(p, pick.uid);
        if(loc){
          p.fields[loc.key].cards = p.fields[loc.key].cards.filter(c=>c.uid!==pick.uid);
          p.hand.push(pick.cardId);
          log(`${p.name}の「${bd.name}」の還元で「${cardDef(pick.cardId).name}」を手札に戻した。`);
        }
      }
    }
    if(hasSpecial(bd,'building_periodic_wlp20') && f.turnsOnField>=3){
      f.turnsOnField = 0;
      gainWlp(p, 20);
      log(`${p.name}の「${bd.name}」の世紀を超える建築でWLP+20。`);
    }
  });
}

function endTurn(){
  if(state.gameOver) return;
  applyTurnEndBuildingEffects(state.active);
  if(state.active==='player'){
    state.turnNumber += 1;
    startTurn('ai');
    render();
    setTimeout(aiTurn, 700);
  } else {
    state.turnNumber += 1;
    startTurn('player');
    render();
  }
}

// ---------- era evolution ----------
function tryEvolve(owner){
  if(owner.era >= MAX_ERA){ return; }
  const threshold = wlpThresholdFor(owner.era);
  if(owner.wlp < threshold) return;
  const turnsIntoEra = state.turnNumber - owner.eraStartTurn;
  const prevEra = owner.era;
  owner.wlp -= threshold;
  owner.era += 1;
  owner.eraStartTurn = state.turnNumber;
  owner.deck = buildEraDeck(owner);
  const handNeeded = 7 - owner.hand.length;
  if(handNeeded > 0) drawCard(owner, handNeeded);
  log(`${owner.name}の文明は「${ERA_NAMES[owner.era]}」へ進化した！デッキが${ERA_NAMES[owner.era]}用に刷新され、手札を補充した。`);
  if(prevEra===1 && owner.coreShield>0){
    log(`${owner.name}: 古代のCoreシールドが失われた(残${owner.coreShield}が消滅)。`);
    owner.coreShield = 0;
  } else if(prevEra===1){
    owner.coreShield = 0;
  }
  if(turnsIntoEra < 4){
    owner.debuffTurns = 3;
    owner.maxEnergy = Math.max(1, owner.maxEnergy-1);
    log(`${owner.name}: 急速な発展により社会問題が発生！（3ターンの間、攻撃力-1・Energy上限-1）`);
  }
}

// ---------- AI ----------
function aiTurn(){
  try{
    aiTurnInner();
  }catch(err){
    console.error('AI turn error, recovering:', err);
    log('(相手のターン処理でエラーが発生したため、ターンを進めます)');
    finishAiTurn();
  }
}

function aiTurnInner(){
  if(state.gameOver) return;
  const ai = state.ai, pl = state.player;

  // play cards greedily, cheapest playable first, until can't afford more
  let progressed = true;
  while(progressed){
    progressed = false;
    const playableIdx = ai.hand
      .map((id,idx)=>({id,idx}))
      .filter(x=>canPlay(ai, x.id))
      .sort((a,b)=>cardDef(a.id).cost - cardDef(b.id).cost);
    if(playableIdx.length>0){
      const choice = playableIdx[0];
      const cd = cardDef(choice.id);
      let key = undefined;
      if(cd.type==='person'||cd.type==='building'){
        key = ai.fields.f1.cards.length < FIELD_MAX ? 'f1' : 'f2';
      }
      playCard(ai, pl, choice.idx, key);
      progressed = true;
      render();
    }
  }

  // guaranteed economy growth: the AI always raises its Energy cap at least once per turn
  // (as long as it still has a spare card to discard), so it never falls behind on Energy.
  if(!ai.energyUpUsedThisTurn && ai.hand.length>0 && ai.maxEnergy<10){
    let idx = 0, maxCost = -1;
    ai.hand.forEach((id,i)=>{ const d=cardDef(id); if(d.cost>maxCost){ maxCost=d.cost; idx=i; } });
    const d = cardDef(ai.hand[idx]);
    ai.hand.splice(idx,1);
    ai.maxEnergy = Math.min(10, ai.maxEnergy+1);
    ai.energyUpUsedThisTurn = true;
    log(`相手: 「${d.name}」を捨ててEnergy上限を+1した。`);
    render();
  }

  // evolve if possible
  if(ai.wlp >= wlpThresholdFor(ai.era) && ai.era < MAX_ERA){
    tryEvolve(ai);
  }

  // attack with all available persons
  const attackers = allFieldCards(ai).filter(f=>{
    const d = cardDef(f.cardId);
    return d.type==='person' && !f.sick && !f.attacked;
  });

  function doAiAttacks(i){
    try{
      if(i>=attackers.length || state.gameOver){ render(); setTimeout(finishAiTurn, 500); return; }
      const attacker = attackers[i];
      const aAtk = effectiveAtk(ai, attacker);
      // front-to-back targeting: only the player's currently-exposed zone is attackable
      const zone = attackableZoneKey(pl);
      let target = null;
      if(zone==='core'){
        target = {kind:'core'};
      } else {
        const zonePersons = pl.fields[zone].cards.filter(f=>cardDef(f.cardId).type==='person');
        const goodTrade = zonePersons.find(t => aAtk >= t.hp && effectiveAtk(pl,t) < attacker.hp);
        const chosen = goodTrade || zonePersons[0];
        target = {kind:'field', uid:chosen.uid};
      }

      // 護国: a living blocker can intercept an attack aimed at the Core OR at a fellow
      // person (it can't "block" an attack that's already aimed at itself)
      const ignoresBlockers = hasSpecial(cardDef(attacker.cardId), 'kyushu');
      const rawBlockers = ignoresBlockers ? [] : livingBlockers(pl);
      const blockers = rawBlockers.filter(b=> !(target.kind==='field' && b.uid===target.uid));
      if(blockers.length>0){
        // player gets to choose whether to block
        promptPlayerBlock(attacker, ai, blockers, target, ()=>{ doAiAttacks(i+1); });
        return;
      } else {
        if(ignoresBlockers && rawBlockers.length>0) log(`${ai.name}の「${cardDef(attacker.cardId).name}」は急襲で護国を無視した！`);
        resolveAttack(ai, attacker, pl, target);
      }
      render();
      // 進軍: if this attacker defeated a person and got to act again, retry it before moving on
      const stillOnField = findFieldCard(ai, attacker.uid);
      const nextIndex = (stillOnField && attacker.attacked===false) ? i : i+1;
      setTimeout(()=>doAiAttacks(nextIndex), 500);
    }catch(err){
      console.error('AI attack error, recovering:', err);
      log('(相手の攻撃処理でエラーが発生したため、ターンを進めます)');
      render();
      setTimeout(finishAiTurn, 300);
    }
  }
  doAiAttacks(0);
}

function finishAiTurn(){
  render();
  endTurn();
}

// let the player choose whether to intercept an incoming attack with a 護国 unit.
// originalTarget is what the attack would hit if not blocked: {kind:'core'} or {kind:'field', uid}
function promptPlayerBlock(attacker, attackerOwner, blockers, originalTarget, cb){
  const overlay = document.getElementById('overlay');
  const title = document.getElementById('modal-title');
  const body = document.getElementById('modal-body');
  const buttons = document.getElementById('modal-buttons');
  const dmg = effectiveAtk(attackerOwner, attacker);
  const targetIsCore = originalTarget.kind==='core';
  const targetLoc = targetIsCore ? null : findFieldCard(state.player, originalTarget.uid);
  const targetName = targetIsCore ? 'Core' : (targetLoc ? `「${cardDef(targetLoc.card.cardId).name}」` : 'あなたの偉人');
  title.textContent = targetIsCore ? '相手があなたのCoreを攻撃！' : '相手があなたの偉人を攻撃！';
  body.textContent = `「${cardDef(attacker.cardId).name}」(攻撃力${dmg})が${targetName}を狙っています。護国で防ぎますか？`;
  buttons.innerHTML = '';
  blockers.forEach(b=>{
    const d = cardDef(b.cardId);
    const btn = document.createElement('button');
    btn.textContent = `${d.name}(HP${b.hp})で防ぐ`;
    btn.onclick = ()=>{
      overlay.style.display='none';
      b.attacked = true;
      resolveAttack(attackerOwner, attacker, state.player, {kind:'field', uid:b.uid});
      log(`あなたの「${d.name}」が護国で防いだ！`);
      render();
      cb();
    };
    buttons.appendChild(btn);
  });
  const skip = document.createElement('button');
  skip.textContent = targetIsCore ? '防がずにCoreで受ける' : '防がずに受ける';
  skip.className='primary';
  skip.onclick = ()=>{
    overlay.style.display='none';
    resolveAttack(attackerOwner, attacker, state.player, originalTarget);
    render();
    cb();
  };
  buttons.appendChild(skip);
  overlay.style.display='flex';
}

// ---------- rendering ----------
function cardHtml(f, owner, ownerKey, opts){
  opts = opts||{};
  const d = cardDef(f.cardId);
  const classes = ['card', d.type];
  if(opts.selectable) classes.push('selectable');
  if(opts.selected) classes.push('selected');
  if(f.sick) classes.push('sick');
  else if(f.attacked) classes.push('attacked');
  if(opts.atktarget) classes.push('atktarget');
  if(opts.dimmed) classes.push('not-attackable');

  let statsHtml = '';
  if(d.type==='person'){
    const shownAtk = effectiveAtk(owner, f);
    statsHtml = `<div class="stats"><span class="atk">攻${shownAtk}</span><span class="hp">HP${f.hp}</span></div>`;
  } else if(d.type==='building'){
    statsHtml = `<div class="stats"><span class="hp">HP${f.hp}/${f.maxHp}</span></div>`;
  }
  const blk = hasSpecial(d,'gokoku') ? `<div class="blk">🛡️</div>` : '';
  return `<div class="${classes.join(' ')}" data-uid="${f.uid}" data-owner="${ownerKey}">
    ${blk}
    <button class="info-btn" data-uid="${f.uid}" data-owner-info="${ownerKey}" title="詳細">ℹ</button>
    <div class="name">${flagHtml(d)}${d.name}</div>
    <div class="type">${d.type==='person'?'偉人':d.type==='building'?'建物':'政策'} ・era${d.era}</div>
    ${statsHtml}
  </div>`;
}

function handCardHtml(cardId, idx, owner){
  const d = cardDef(cardId);
  const eraLocked = d.era !== owner.era;
  const affordable = effectiveCost(owner, d) <= owner.energy;
  const classes = ['card', d.type];
  if(eraLocked || !affordable) classes.push('locked');
  else classes.push('selectable');
  const eraNote = eraLocked ? (d.era > owner.era ? ` (era${d.era}未到達)` : ` (era${d.era}・時代遅れ)`) : '';
  const kwTags = (d.specials||[]).filter(s=>KEYWORD_DEFS[s]).map(s=>KEYWORD_DEFS[s].name).join(' ');
  return `<div class="${classes.join(' ')}" data-hand-idx="${idx}">
    <div class="costtag">${effectiveCost(owner,d)}</div>
    <div class="name">${flagHtml(d)}${d.name}</div>
    <div class="type">${d.type==='person'?'偉人':d.type==='building'?'建物':'政策'}${eraNote}</div>
    ${kwTags?`<div class="kw-tags">【${kwTags.replace(/ /g,'】【')}】</div>`:''}
    ${d.type==='person'?`<div class="stats"><span class="atk">攻${d.atk}</span><span class="hp">HP${d.hp}</span></div>`:''}
    ${d.type==='building'?`<div class="stats"><span class="hp">HP${d.hp}</span></div>`:''}
    ${d.type==='policy'?`<div class="stats"><span>持続:${d.duration||3}ターン</span></div>`:''}
  </div>`;
}

// hand card detail modal: full keyword descriptions, flavor text, and the discard-for-energy action
function showHandCardDetail(idx){
  const owner = state.player;
  const cardId = owner.hand[idx];
  if(!cardId) return;
  const d = cardDef(cardId);
  const overlay = document.getElementById('overlay');
  document.getElementById('modal-title').innerHTML = flagHtml(d) + ' ' + d.name;
  document.getElementById('modal-body').innerHTML =
    `<div style="margin-bottom:6px;">${d.type==='person'?'偉人':d.type==='building'?'建物':'政策'} ・ era${d.era} ・ コスト${effectiveCost(owner,d)}${d.type==='policy'?` ・ 持続${d.duration||3}ターン`:''}</div>` +
    keywordTagsHtml(d) +
    `<div>${d.text}</div>`;
  const buttons = document.getElementById('modal-buttons');
  buttons.innerHTML = '';
  if(state.active==='player' && !state.gameOver){
    const play = document.createElement('button');
    play.textContent = '場に出す';
    play.className = 'primary';
    play.disabled = !canPlay(owner, cardId);
    play.onclick = ()=>{
      overlay.style.display = 'none';
      const curIdx = owner.hand.indexOf(cardId);
      if(curIdx<0 || !canPlay(owner, cardId)){
        document.getElementById('hint').textContent = playFailReason(owner, cardId);
        return;
      }
      if(d.type==='person'||d.type==='building'){
        promptFieldChoice(curIdx, d);
      } else {
        const played = playCard(owner, state.ai, curIdx);
        if(played){ checkGameOver(); render(); }
      }
    };
    buttons.appendChild(play);

    const discard = document.createElement('button');
    discard.textContent = '捨てて上限+1';
    discard.disabled = owner.energyUpUsedThisTurn;
    discard.onclick = ()=>{
      overlay.style.display = 'none';
      const curIdx = owner.hand.indexOf(cardId);
      if(curIdx<0 || owner.energyUpUsedThisTurn) return;
      owner.hand.splice(curIdx,1);
      owner.maxEnergy = Math.min(10, owner.maxEnergy+1);
      owner.energyUpUsedThisTurn = true;
      log(`あなた: 「${d.name}」を捨ててEnergy上限を+1した。`);
      render();
    };
    buttons.appendChild(discard);
  }
  const close = document.createElement('button');
  close.textContent = '閉じる';
  close.className = 'primary';
  close.onclick = ()=>{ overlay.style.display = 'none'; };
  buttons.appendChild(close);
  overlay.style.display = 'flex';
}

// render up to FIELD_MAX slots for one field (cards + empty placeholders)
function renderFieldSlots(elId, cards, owner, ownerKey, selectable, fieldKey){
  const el = document.getElementById(elId);
  const attackerSelected = state.selected && state.selected.type==='field';
  const zone = (!selectable && attackerSelected) ? attackableZoneKey(owner) : null;
  let html = '';
  cards.forEach(f=>{
    if(selectable){
      const d = cardDef(f.cardId);
      const canSelectAttacker = state.active==='player' && d.type==='person' && !f.sick && !f.attacked;
      const isSelected = state.selected && state.selected.type==='field' && state.selected.uid===f.uid;
      html += cardHtml(f, owner, ownerKey, {selectable: canSelectAttacker, selected: isSelected});
    } else {
      const inZone = attackerSelected && state.active==='player' && fieldKey===zone;
      const dimmed = attackerSelected && state.active==='player' && fieldKey!==zone;
      html += cardHtml(f, owner, ownerKey, {atktarget: inZone, dimmed});
    }
  });
  for(let i=cards.length; i<FIELD_MAX; i++){
    html += '<div class="field-slot-empty">+</div>';
  }
  el.innerHTML = html;
}

function render(){
  document.getElementById('ai-hp-fill').style.width = Math.max(0,state.ai.coreHp)+'%';
  document.getElementById('ai-hp-num').textContent = `Core HP: ${Math.max(0,state.ai.coreHp)}/100${state.ai.coreShield>0?` 🛡️+${state.ai.coreShield}`:''}`;
  document.getElementById('p-hp-fill').style.width = Math.max(0,state.player.coreHp)+'%';
  document.getElementById('p-hp-num').textContent = `Core HP: ${Math.max(0,state.player.coreHp)}/100${state.player.coreShield>0?` 🛡️+${state.player.coreShield}`:''}`;

  document.getElementById('ai-core-icon').src = ASSET_CORE_ENEMY;
  document.getElementById('p-core-icon').src = ASSET_CORE_SELF;

  document.getElementById('ai-wlp-icon').src = ASSET_ICON_WLP;
  document.getElementById('p-wlp-icon').src = ASSET_ICON_WLP;
  document.getElementById('ai-deck-icon').src = ASSET_CARDBACK;
  document.getElementById('p-deck-icon').src = ASSET_CARDBACK;
  document.getElementById('ai-deck-count').textContent = state.ai.deck.length;
  document.getElementById('p-deck-count').textContent = state.player.deck.length;

  // energy pips
  function renderPips(elId, owner){
    const el = document.getElementById(elId);
    let html = '';
    for(let i=0;i<owner.maxEnergy;i++){
      html += `<span class="energy-pip${i<owner.energy?' filled':''}"></span>`;
    }
    el.innerHTML = html;
  }
  renderPips('ai-energy-pips', state.ai);
  renderPips('p-energy-pips', state.player);

  document.getElementById('ai-era-icon').src = ERA_ICON_MAP[state.ai.era];
  document.getElementById('ai-era-text').textContent = `時代: ${ERA_NAMES[state.ai.era]}`;
  document.getElementById('p-era-icon').src = ERA_ICON_MAP[state.player.era];
  document.getElementById('p-era-text').textContent = `時代: ${ERA_NAMES[state.player.era]}`;
  document.getElementById('ai-wlp').textContent = `${state.ai.wlp}/${wlpThresholdFor(state.ai.era)}`;
  document.getElementById('p-wlp').textContent = `${state.player.wlp}/${wlpThresholdFor(state.player.era)}`;

  const aiDeb = document.getElementById('ai-debuff');
  if(state.ai.debuffTurns>0){ aiDeb.style.display='inline-block'; aiDeb.textContent=`社会問題(残${state.ai.debuffTurns}T)`; } else aiDeb.style.display='none';
  const pDeb = document.getElementById('p-debuff');
  if(state.player.debuffTurns>0){ pDeb.style.display='inline-block'; pDeb.textContent=`社会問題(残${state.player.debuffTurns}T)`; } else pDeb.style.display='none';

  // active persistent policies, with their remaining duration
  function policyCardHtml(pol, ownerKey){
    const d = cardDef(pol.cardId);
    const kwTags = (d.specials||[]).filter(s=>KEYWORD_DEFS[s]).map(s=>KEYWORD_DEFS[s].name).join(' ');
    return `<div class="card policy policy-chip" data-policy-uid="${pol.uid}" data-owner-info="${ownerKey}">
      <div class="name">${flagHtml(d)}${d.name}</div>
      ${kwTags?`<div class="kw-tags">【${kwTags.replace(/ /g,'】【')}】</div>`:''}
      <div class="policy-duration">持続:${pol.duration}</div>
    </div>`;
  }
  document.getElementById('ai-policies').innerHTML = state.ai.policies.map(p=>policyCardHtml(p,'ai')).join('');
  document.getElementById('p-policies').innerHTML = state.player.policies.map(p=>policyCardHtml(p,'player')).join('');

  // fields (two per side: f1 / f2, each with its own changeable terrain)
  const TERRAIN_ASSET_MAP = {
    plains: ASSET_TERRAIN_PLAINS, mountain: ASSET_TERRAIN_MOUNTAIN, desert: ASSET_TERRAIN_DESERT,
    forest: ASSET_TERRAIN_FOREST, water: ASSET_TERRAIN_WATER,
  };
  function renderFieldHead(sideKey, fieldKey, owner){
    const terrain = owner.fields[fieldKey].terrain;
    const td = TERRAIN_DEFS[terrain];
    document.getElementById(`${sideKey}-${fieldKey}-icon`).textContent = td.icon;
    document.getElementById(`${sideKey}-${fieldKey}-label`).textContent =
      `${fieldKey==='f1'?'フィールド1':'フィールド2'}(${td.name})`;
    document.getElementById(`${sideKey}-field-${fieldKey}`).style.backgroundImage = `url(${TERRAIN_ASSET_MAP[terrain]})`;
  }
  renderFieldHead('ai','f1',state.ai); renderFieldHead('ai','f2',state.ai);
  renderFieldHead('p','f1',state.player); renderFieldHead('p','f2',state.player);

  renderFieldSlots('ai-field-f1-slots', state.ai.fields.f1.cards, state.ai, 'ai', false, 'f1');
  renderFieldSlots('ai-field-f2-slots', state.ai.fields.f2.cards, state.ai, 'ai', false, 'f2');
  renderFieldSlots('p-field-f1-slots', state.player.fields.f1.cards, state.player, 'player', true);
  renderFieldSlots('p-field-f2-slots', state.player.fields.f2.cards, state.player, 'player', true);

  // terrain-change buttons: disabled once used this turn, or if it's not the player's turn
  document.querySelectorAll('.terrain-change-btn').forEach(btn=>{
    btn.disabled = state.active!=='player' || state.player.terrainChangedThisTurn || state.player.energy<1 || state.gameOver;
  });

  // hand
  const handEl = document.getElementById('hand');
  handEl.innerHTML = state.player.hand.map((id,idx)=>handCardHtml(id, idx, state.player)).join('') || '<div class="empty-hint">手札がありません</div>';

  // buttons
  document.getElementById('btn-endturn').disabled = state.active!=='player' || state.gameOver;
  const evolveBtn = document.getElementById('btn-evolve');
  if(state.active==='player' && state.player.wlp>=wlpThresholdFor(state.player.era) && state.player.era<MAX_ERA && !state.gameOver){
    evolveBtn.style.display='inline-block';
  } else {
    evolveBtn.style.display='none';
  }

  updateHint();
  bindCardEvents();
}

function updateHint(){
  const hintEl = document.getElementById('hint');
  if(state.gameOver){
    hintEl.textContent = state.player.coreHp<=0 ? '敗北しました。ページを再読み込みすると再挑戦できます。' : '勝利しました！ページを再読み込みすると再挑戦できます。';
    return;
  }
  if(state.active!=='player'){ hintEl.textContent='相手のターンです…'; return; }
  if(state.selected && state.selected.type==='field'){
    const zone = attackableZoneKey(state.ai);
    if(zone==='core'){
      hintEl.textContent = '攻撃するキャラクターを選択中です。相手のフィールドに偉人はいません。Coreをクリックして攻撃してください。';
    } else {
      hintEl.textContent = `攻撃するキャラクターを選択中です。まずフィールド${zone==='sea'?'1(海)':'2(平地)'}の偉人からしか攻撃できません(薄く表示されたカードは今は狙えません)。`;
    }
  } else {
    hintEl.textContent = '手札のカードをタップすると詳細が見られます。そこから場に出す・捨てるを選べます。自分のキャラクターをタップすると攻撃できます。';
  }
}

function playFailReason(owner, cardId){
  const d = cardDef(cardId);
  if(d.era > owner.era) return `「${d.name}」は時代「${ERA_NAMES[d.era]}」に到達してから使えます。`;
  if(d.era < owner.era) return `「${d.name}」は時代が過ぎ去ったため場には出せません(捨ててEnergy上限+1には使えます)。`;
  if(effectiveCost(owner, d) > owner.energy) return `「${d.name}」を出すにはEnergyが足りません(必要${effectiveCost(owner,d)} / 所持${owner.energy})。`;
  if(d.type==='person'||d.type==='building'){
    if(owner.fields.f1.cards.length>=FIELD_MAX && owner.fields.f2.cards.length>=FIELD_MAX) return `フィールド1・2ともにいっぱいです(各最大${FIELD_MAX}体)。`;
  }
  if(d.type==='policy' && owner.policies.length>=POLICY_MAX) return `政策は同時に${POLICY_MAX}つまでしか制定できません。`;
  return '';
}

// let the player pick which field (sea or plain) to place a person/building card into
function promptFieldChoice(handIdx, d){
  const owner = state.player;
  const overlay = document.getElementById('overlay');
  document.getElementById('modal-title').textContent = `「${d.name}」をどちらに出しますか？`;
  document.getElementById('modal-body').textContent = '地形の効果は各フィールドのボタンで確認・変更できます。';
  const buttons = document.getElementById('modal-buttons');
  buttons.innerHTML = '';

  ['f1','f2'].forEach(key=>{
    const field = owner.fields[key];
    const full = field.cards.length >= FIELD_MAX;
    const td = TERRAIN_DEFS[field.terrain];
    const btn = document.createElement('button');
    btn.textContent = `${key==='f1'?'フィールド1':'フィールド2'}(${td.icon}${td.name}) ${full?'(満杯)':`(${field.cards.length}/${FIELD_MAX})`}`;
    btn.disabled = full;
    if(key==='f1') btn.className = 'primary';
    btn.onclick = ()=>{
      overlay.style.display = 'none';
      const played = playCard(owner, state.ai, handIdx, key);
      if(played){ checkGameOver(); render(); }
    };
    buttons.appendChild(btn);
  });

  const cancel = document.createElement('button');
  cancel.textContent = 'キャンセル';
  cancel.onclick = ()=>{ overlay.style.display = 'none'; };
  buttons.appendChild(cancel);

  overlay.style.display = 'flex';
}

// show a field card's full details (name/type/era/cost/current stats/ability text) in the modal
// render a card's keyword ability tags (name + rules text) as HTML, or '' if it has none
function keywordTagsHtml(d){
  if(!d.specials || d.specials.length===0) return '';
  const known = d.specials.filter(s=>KEYWORD_DEFS[s]);
  if(known.length===0) return '';
  return `<div style="margin-bottom:6px;">` + known.map(s=>
    `<div><b style="color:var(--gold-soft);">【${KEYWORD_DEFS[s].name}】</b> ${KEYWORD_DEFS[s].desc}</div>`
  ).join('') + `</div>`;
}

function showCardDetail(ownerKey, uid){
  const owner = ownerKey==='ai' ? state.ai : state.player;
  const loc = findFieldCard(owner, uid);
  if(!loc) return;
  const f = loc.card;
  const d = cardDef(f.cardId);
  const overlay = document.getElementById('overlay');
  document.getElementById('modal-title').innerHTML = flagHtml(d) + ' ' + d.name;
  let statsLine = '';
  if(d.type==='person'){
    statsLine = `攻撃力: ${effectiveAtk(owner, f)}(基礎${f.atk}) / HP: ${f.hp}/${f.maxHp}`;
    if(f.shield>0) statsLine += ` ・🛡️シールド${f.shield}`;
    if(f.sick) statsLine += ' ・召喚酔い中';
    if(f.attacked) statsLine += ' ・このターン行動済み';
  } else if(d.type==='building'){
    statsLine = `HP: ${f.hp}/${f.maxHp}`;
    if(f.playedThisTurn && (d.kangen || d.kangenRevivePerson || d.kangenBuffAllyAtk)) statsLine += ' ・出したばかりで還元不可';
  }
  document.getElementById('modal-body').innerHTML =
    `<div style="margin-bottom:6px;">${d.type==='person'?'偉人':d.type==='building'?'建物':'政策'} ・ era${d.era} ・ コスト${d.cost}</div>` +
    `<div style="margin-bottom:6px;">${statsLine}</div>` +
    keywordTagsHtml(d) +
    `<div>${d.text}</div>`;
  const buttons = document.getElementById('modal-buttons');
  buttons.innerHTML = '';
  // 退却: the player may return their own card with this keyword to hand at any time
  if(ownerKey==='player' && hasSpecial(d,'taikyaku') && state.active==='player' && !state.gameOver && owner.hand.length<HAND_MAX){
    const retreat = document.createElement('button');
    retreat.textContent = '退却(手札に戻す)';
    retreat.onclick = ()=>{
      overlay.style.display = 'none';
      const loc2 = findFieldCard(owner, uid);
      if(loc2){
        owner.fields[loc2.key].cards = owner.fields[loc2.key].cards.filter(c=>c.uid!==uid);
        owner.hand.push(f.cardId);
        log(`${owner.name}: 「${d.name}」を退却させ、手札に戻した。`);
        render();
      }
    };
    buttons.appendChild(retreat);
  }
  // 還元: self-destruct this building for a one-time effect
  if(ownerKey==='player' && d.type==='building' && d.kangen && state.active==='player' && !state.gameOver && !f.playedThisTurn){
    const kangen = document.createElement('button');
    kangen.textContent = '還元(自ら破壊して効果を得る)';
    kangen.onclick = ()=>{
      overlay.style.display = 'none';
      const loc3 = findFieldCard(owner, uid);
      if(loc3){
        owner.fields[loc3.key].cards = owner.fields[loc3.key].cards.filter(c=>c.uid!==uid);
        owner.graveyard.push(f.cardId);
        log(`${owner.name}: 「${d.name}」を還元した。`);
        applyEffect(owner, ownerKey==='player' ? state.ai : state.player, d.kangen);
        render();
      }
    };
    buttons.appendChild(kangen);
  }
  // 還元(始皇帝陵タイプ): self-destruct this building to revive a person from the graveyard
  if(ownerKey==='player' && d.type==='building' && d.kangenRevivePerson && state.active==='player' && !state.gameOver && !f.playedThisTurn){
    const personEntries = owner.graveyard
      .map((cid,idx)=>({cid,idx}))
      .filter(e=>cardDef(e.cid).type==='person');
    const kangen2 = document.createElement('button');
    kangen2.textContent = '還元(自ら破壊して偉人を復活させる)';
    kangen2.disabled = personEntries.length===0;
    kangen2.onclick = ()=>{
      overlay.style.display = 'none';
      const loc4 = findFieldCard(owner, uid);
      if(!loc4) return;
      owner.fields[loc4.key].cards = owner.fields[loc4.key].cards.filter(c=>c.uid!==uid);
      owner.graveyard.push(f.cardId);
      log(`${owner.name}: 「${d.name}」を還元した。`);
      const freshPersonEntries = owner.graveyard
        .map((cid,idx)=>({cid,idx}))
        .filter(e=>cardDef(e.cid).type==='person');
      if(freshPersonEntries.length===1){
        applyRevivePerson(owner, freshPersonEntries[0].idx);
        render();
      } else if(freshPersonEntries.length>1){
        promptRevivePersonTarget(owner, freshPersonEntries);
      } else {
        render();
      }
    };
    buttons.appendChild(kangen2);
  }
  // 還元(安土城タイプ): self-destruct this building to buff one own person's ATK
  if(ownerKey==='player' && d.type==='building' && d.kangenBuffAllyAtk && state.active==='player' && !state.gameOver && !f.playedThisTurn){

      log(`${owner.name}: 「${d.name}」を還元した。`);
      const amt = d.kangenBuffAllyAtk;

        log(`${owner.name}の「${d.name}」の還元で「${cardDef(ownPersons[0].cardId).name}」のATK+${amt}。`);
        render();

        promptKangenAtkTarget(d, owner, ownPersons, amt);

function bindCardEvents(){
  // active policy chips -> show their details
  document.querySelectorAll('.policy-chip').forEach(el=>{
    el.onclick = ()=>{
      showPolicyDetail(el.dataset.ownerInfo, el.dataset.policyUid);
    };
  });

  // info buttons -> show full card detail (field cards on both sides)
  document.querySelectorAll('.info-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      showCardDetail(btn.dataset.ownerInfo, btn.dataset.uid);
    };
  });

  // hand cards -> tap to see details, then play / discard from the popup
  document.querySelectorAll('#hand .card').forEach(el=>{
    el.onclick = ()=>{
      if(state.active!=='player'||state.gameOver) return;
      const idx = parseInt(el.dataset.handIdx,10);
      showHandCardDetail(idx);
    };
  });

  // player field cards -> select as attacker
  document.querySelectorAll('#p-field-f1-slots .card.selectable, #p-field-f2-slots .card.selectable').forEach(el=>{
    el.onclick = ()=>{
      if(state.active!=='player'||state.gameOver) return;
      const uid = el.dataset.uid;
      if(state.selected && state.selected.type==='field' && state.selected.uid===uid){
        state.selected = null;
      } else {
        state.selected = {type:'field', uid};
      }
      render();
    };
  });

  // resolve a player-initiated attack, letting the AI auto-block with a 護国 unit
  // (whether the original target is the Core or one of the AI's own persons)
  function resolvePlayerAttack(attacker, target){
    const ignoresBlockers = hasSpecial(cardDef(attacker.cardId), 'kyushu');
    const rawBlockers = ignoresBlockers ? [] : livingBlockers(state.ai);
    const blockers = rawBlockers.filter(b=> !(target.kind==='field' && b.uid===target.uid));
    if(blockers.length>0){
      // the AI automatically uses its first available blocker (護国) to intercept
      const b = blockers[0];
      b.attacked = true;
      resolveAttack(state.player, attacker, state.ai, {kind:'field', uid:b.uid});
      log(`相手の「${cardDef(b.cardId).name}」が護国で防いだ！`);
    } else {
      if(ignoresBlockers && rawBlockers.length>0) log(`「${cardDef(attacker.cardId).name}」は急襲で護国を無視した！`);
      resolveAttack(state.player, attacker, state.ai, target);
    }
    // 進軍: if this attacker defeated a person and can act again, keep it selected
    const stillOnField = findFieldCard(state.player, attacker.uid);
    state.selected = (stillOnField && attacker.attacked===false) ? {type:'field', uid:attacker.uid} : null;
    checkGameOver();
    render();
  }

  // enemy field cards -> attack target (only within the currently exposed front-to-back zone)
  document.querySelectorAll('#ai-field-f1-slots .card, #ai-field-f2-slots .card').forEach(el=>{
    el.onclick = ()=>{
      if(state.active!=='player'||state.gameOver) return;
      if(!state.selected || state.selected.type!=='field') return;
      const loc = findFieldCard(state.player, state.selected.uid);
      if(!loc) return;
      const attacker = loc.card;
      const targetUid = el.dataset.uid;
      const targetLoc = findFieldCard(state.ai, targetUid);
      if(!targetLoc) return;
      const zone = attackableZoneKey(state.ai);
      if(zone==='core' || targetLoc.key!==zone){
        document.getElementById('hint').textContent =
          zone==='core' ? '相手のフィールドの偉人はいなくなっています。Coreを攻撃してください。'
          : `まずフィールド${zone==='sea'?'1(海)':'2(平地)'}の偉人を倒してください。`;
        return;
      }
      resolvePlayerAttack(attacker, {kind:'field', uid:targetUid});
    };
  });

  // enemy core -> attack target (only once both enemy fields have no persons left)
  const aiCoreCard = document.getElementById('ai-core-hp');
  aiCoreCard.onclick = ()=>{
    if(state.active!=='player'||state.gameOver) return;
    if(!state.selected || state.selected.type!=='field') return;
    const loc = findFieldCard(state.player, state.selected.uid);
    if(!loc) return;
    const attacker = loc.card;
    const zone = attackableZoneKey(state.ai);
    if(zone!=='core'){
      document.getElementById('hint').textContent =
        `まずフィールド${zone==='sea'?'1(海)':'2(平地)'}の偉人を倒してからでないとCoreは攻撃できません。`;
      return;
    }
    resolvePlayerAttack(attacker, {kind:'core'});
  };
}

// player's chosen per-era decks (each id appears at most once per era); an empty array for
// an era means "auto-build from every card of that era" for that era.
let customDecks = {1:[], 2:[], 3:[]};
let dbCurrentEra = 1;

function renderDeckBuilder(){
  const el = document.getElementById('deckbuilder-list');
  const eraNames = {1:'古代', 2:'中世', 3:'近世'};
  const cards = CARD_DB.filter(c=>c.era===dbCurrentEra);
  let html = '';
  cards.forEach(d=>{
    const checked = customDecks[dbCurrentEra].includes(d.id);
    const statsBit = d.type==='person' ? `攻${d.atk}/HP${d.hp}`
                    : d.type==='building' ? `HP${d.hp}`
                    : `持続${d.duration||3}ターン`;
    const blockerBit = '';
    const kwNames = (d.specials||[]).filter(s=>KEYWORD_DEFS[s]).map(s=>KEYWORD_DEFS[s].name);
    const kwBit = kwNames.length ? `<b style="color:var(--gold-soft);">【${kwNames.join('】【')}】</b> ` : '';
    html += `<div class="db-row" data-cardid="${d.id}">
      <input type="checkbox" data-cardid="${d.id}" ${checked?'checked':''}>
      <div class="db-main">
        <div class="db-toprow">
          <span class="db-cost">${d.cost}</span>
          <span class="db-name">${flagHtml(d)}${d.name}</span>
          <span class="db-type">${d.type==='person'?'偉人':d.type==='building'?'建物':'政策'}</span>
        </div>
        <div class="db-effect">${kwBit}${statsBit?`<b>${statsBit}${blockerBit}</b> ・ `:''}${d.text}</div>
      </div>
      <button class="db-info-btn" data-cardid="${d.id}" title="効果を見る">ℹ</button>
    </div>`;
  });
  el.innerHTML = html;
  document.querySelectorAll('.db-tab').forEach(tab=>{
    tab.classList.toggle('active', parseInt(tab.dataset.era,10)===dbCurrentEra);
  });
  updateDeckBuilderCount();
  function toggleCard(cb){
    const id = cb.dataset.cardid;
    const list = customDecks[dbCurrentEra];
    if(cb.checked){
      if(list.length>=40){
        cb.checked = false;
        document.getElementById('deckbuilder-msg').textContent = 'デッキは最大40枚までです。';
        return;
      }
      list.push(id);
    } else {
      customDecks[dbCurrentEra] = list.filter(x=>x!==id);
    }
    document.getElementById('deckbuilder-msg').textContent = '';
    updateDeckBuilderCount();
  }
  el.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=> toggleCard(cb);
  });
  // clicking anywhere in the row (except the checkbox itself or the info button) also toggles it
  el.querySelectorAll('.db-row').forEach(row=>{
    row.onclick = (e)=>{
      if(e.target.tagName==='INPUT' || e.target.closest('.db-info-btn')) return;
      const cb = row.querySelector('input[type=checkbox]');
      cb.checked = !cb.checked;
      toggleCard(cb);
    };
  });
  // info button -> show the card's full text/ability in the modal (no game state needed)
  el.querySelectorAll('.db-info-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      showCardDefDetail(btn.dataset.cardid);
    };
  });
}

      </ul>
    </div>
    <div class="rules-section">
      <h4>キーワード能力(16種)</h4>
      <ul>${kwListHtml}</ul>
    </div>
  `;
  const buttons = document.getElementById('modal-buttons');
  buttons.innerHTML = '';
  const close = document.createElement('button');
  close.textContent = '閉じる';
  close.className = 'primary';
  close.onclick = ()=>{ overlay.style.display = 'none'; };
  buttons.appendChild(close);
  overlay.style.display = 'flex';
};

// brief attack flash effect, positioned and rotated to point from the attacker toward
// whatever it's hitting (an enemy card, or the enemy Core)
function showAttackFx(attacker, target, attackerOwner){
  const img = document.getElementById('attack-flash');
  img.src = ASSET_FX_ATTACK;
  img.classList.remove('show');

  const atkEl = attacker ? document.querySelector(`.card[data-uid="${attacker.uid}"]`) : null;
  let targetEl = null;
  if(target){
    if(target.kind==='core'){
      const targetIsPlayerCore = attackerOwner===state.ai;
      targetEl = document.getElementById(targetIsPlayerCore ? 'p-core-hp' : 'ai-core-hp');
    } else {
      targetEl = document.querySelector(`.card[data-uid="${target.uid}"]`);
    }
  }

  if(atkEl && targetEl){
    const ar = atkEl.getBoundingClientRect();
    const tr = targetEl.getBoundingClientRect();
    const ax = ar.left + ar.width/2, ay = ar.top + ar.height/2;
    const tx = tr.left + tr.width/2, ty = tr.top + tr.height/2;
    const dx = tx-ax, dy = ty-ay;
    const dist = Math.min(420, Math.max(50, Math.hypot(dx,dy)));
    const angle = Math.atan2(dy,dx) * 180/Math.PI;
    const midx = (ax+tx)/2, midy = (ay+ty)/2;
    img.style.left = midx+'px';
    img.style.top = midy+'px';
    img.style.width = dist+'px';
    img.style.transform = `translate(-50%,-50%) rotate(${angle}deg)`;
  } else {
    // fallback: can't locate one of the elements (e.g. off-screen) — show centered
    img.style.left = '50%';
    img.style.top = '50%';
    img.style.width = '260px';
    img.style.transform = 'translate(-50%,-50%)';
  }

  void img.offsetWidth; // restart animation
  img.classList.add('show');
}

</script>
