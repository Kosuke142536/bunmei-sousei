<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文明創世 -Civilization Genesis-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700;900&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDE4D3;
    --bg-soft:#E4D9C0;
    --text:#2B2620;
    --text-dim:#5c5344;
    --card-bg:#F7F1E3;
    --card-bg-locked:#DCD2B8;
    --border:#8A7B5E;
    --border-strong:#5c5039;
    --red:#7A2E2E;
    --red-soft:#a9564f;
    --green:#35573F;
    --green-soft:#5c8a68;
    --gold:#a3781c;
    --gold-soft:#C9A227;
    --shadow: 0 2px 0 rgba(43,38,32,0.15);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1E1A15;
      --bg-soft:#262019;
      --text:#EAE1CC;
      --text-dim:#b3a68a;
      --card-bg:#2C251C;
      --card-bg-locked:#211c16;
      --border:#6B5D42;
      --border-strong:#8f7c56;
      --red:#c0574f;
      --red-soft:#e08078;
      --green:#6fa37d;
      --green-soft:#8fc19c;
      --gold:#e0b94a;
      --gold-soft:#f0cf74;
      --shadow: 0 2px 0 rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
      --bg:#1E1A15;
      --bg-soft:#262019;
      --text:#EAE1CC;
      --text-dim:#b3a68a;
      --card-bg:#2C251C;
      --card-bg-locked:#211c16;
      --border:#6B5D42;
      --border-strong:#8f7c56;
      --red:#c0574f;
      --red-soft:#e08078;
      --green:#6fa37d;
      --green-soft:#8fc19c;
      --gold:#e0b94a;
      --gold-soft:#f0cf74;
      --shadow: 0 2px 0 rgba(0,0,0,0.4);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Noto Serif JP','Hiragino Mincho ProN',serif;
    font-size:14px;
    line-height:1.5;
    padding:14px;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Shippori Mincho','Noto Serif JP',serif; margin:0;}
  .wrap{max-width:980px;margin:0 auto;}

  header.title{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    border-bottom:2px solid var(--border-strong);
    padding-bottom:10px; margin-bottom:12px; flex-wrap:wrap;
  }
  header.title h1{font-size:22px; font-weight:700; letter-spacing:.04em;}
  header.title .sub{font-size:12px; color:var(--text-dim);}

  .banner{
    background:var(--bg-soft); border:1px solid var(--border);
    padding:10px 14px; border-radius:2px; margin-bottom:12px; font-size:13px; color:var(--text-dim);
  }
  #btn-rules{ font-weight:700; }
  #btn-rules:hover{ background:var(--gold-soft); color:#2b2620; }
  .rules-section{margin-bottom:10px;}
  .rules-section h4{font-size:13px; color:var(--gold-soft); margin-bottom:3px;}
  .rules-section ul{margin:0; padding-left:18px; font-size:12.5px; line-height:1.5;}
  .rules-section li{margin-bottom:2px;}

  /* ---- side panel (opponent / player status) ---- */
  .side{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--bg-soft); border:1px solid var(--border);
    padding:10px 14px; border-radius:3px; margin-bottom:8px;
  }
  .side h2{font-size:15px; min-width:76px;}
  .core-hp{flex:1 1 160px; min-width:140px; display:flex; align-items:center; gap:8px;}
  .core-hp .core-hp-inner{flex:1; min-width:0;}
  .core-hp .bar{
    height:14px; border:1px solid var(--border-strong); background:var(--card-bg-locked);
    border-radius:8px; overflow:hidden; position:relative;
  }
  .core-hp .fill{height:100%; background:linear-gradient(180deg, var(--red-soft), var(--red)); transition:width .35s;}
  .core-hp .num{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .stat{font-size:12px; white-space:nowrap; display:inline-flex; align-items:center;}
  .stat b{color:var(--gold);}
  .era-badge{
    font-size:12px; border:1px solid var(--gold-soft); color:var(--gold);
    padding:2px 8px; border-radius:10px; white-space:nowrap; display:inline-flex; align-items:center;
  }
  .terrain-badge{
    font-size:12px; border:1px solid var(--green-soft); color:var(--green);
    padding:2px 8px; border-radius:10px; white-space:nowrap; display:inline-flex; align-items:center;
  }
  .debuff-badge{
    font-size:12px; border:1px solid var(--red-soft); color:var(--red);
    padding:2px 8px; border-radius:10px; white-space:nowrap;
  }

  /* ---- field ---- */
  .field-row{
    display:flex; gap:8px; flex-wrap:wrap; min-height:118px;
    background-size:cover; background-position:center;
    padding:8px; border-radius:3px; margin-bottom:8px; align-items:flex-start;
    position:relative;
  }
  .field-row::before{
    content:""; position:absolute; inset:0; background:rgba(10,14,10,0.42); border-radius:3px; z-index:0;
  }
  .field-row > *{ position:relative; z-index:1; }
  .field-row.enemy{ border:1px solid var(--red-soft); }
  .field-row.mine{ border:1px solid var(--green-soft); }
  .empty-hint{color:#e8e2d0; font-size:12px; padding:8px; align-self:center; text-shadow:0 1px 2px rgba(0,0,0,.8);}

  #battle-banner{
    height:64px; background-size:cover; background-position:center 60%;
    border-radius:3px; margin-bottom:8px; border:1px solid var(--border);
  }

  .card{
    width:104px; min-height:112px; background:var(--card-bg); border:1px solid var(--border-strong);
    border-radius:4px; padding:6px 7px; position:relative; cursor:default; box-shadow:var(--shadow);
    user-select:none;
  }
  .card.person{border-top:4px solid var(--red);}
  .card.building{border-top:4px solid var(--gold-soft);}
  .card.policy{border-top:4px solid var(--green);}
  .card .name{font-size:12px; font-weight:700; margin-bottom:3px; line-height:1.25;}
  .card-flag{margin-right:3px; font-size:0.95em;}
  .card-flag-img{
    width:14px; height:10.5px; object-fit:cover; margin-right:3px; vertical-align:middle;
    border:1px solid rgba(0,0,0,0.35); border-radius:1px;
  }
  .card .type{font-size:9px; color:var(--text-dim); margin-bottom:4px;}
  .card .text{font-size:9.5px; color:var(--text-dim); line-height:1.3; min-height:26px;}
  .card .kw-tags{font-size:9px; color:var(--gold-soft); font-weight:700; margin-bottom:2px;}
  .card .costtag{
    position:absolute; top:-8px; left:-8px; width:22px; height:22px; border-radius:50%;
    background:var(--gold-soft); color:#2b2620; font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center; border:1px solid var(--border-strong);
  }
  .card .stats{display:flex; justify-content:space-between; font-size:11px; margin-top:4px; font-weight:700;}
  .card .atk{color:var(--red);}
  .card .hp{color:var(--green);}
  .card .dur{font-size:9px; color:var(--text-dim); margin-top:2px;}
  .card.locked{opacity:.45; filter:grayscale(50%);}
  .card.selectable{cursor:pointer;}
  .card.selectable:hover{outline:2px solid var(--gold-soft); outline-offset:1px;}
  .card.selected{outline:3px solid var(--red); outline-offset:1px;}
  .card.sick::after{
    content:"召喚酔"; position:absolute; bottom:4px; right:5px; font-size:8px; color:var(--text-dim);
  }
  .card.attacked::after{
    content:"行動済"; position:absolute; bottom:4px; right:5px; font-size:8px; color:var(--text-dim);
  }
  .card.blocker-tag{}
  .card .blk{position:absolute; top:-8px; right:-8px; font-size:13px;}
  .info-btn{
    position:absolute; top:50%; right:-12px; left:auto; transform:translateY(-50%);
    width:24px; height:24px; border-radius:50%;
    background:var(--bg-soft); color:var(--text); border:1px solid var(--border-strong);
    font-size:14px; line-height:1; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-style:italic; font-family:Georgia,serif; z-index:2;
  }
  .info-btn:hover{ background:var(--gold-soft); color:#2b2620; }
  .card.atktarget:hover{outline:2px solid var(--red);}
  .card.not-attackable{opacity:.4; filter:grayscale(60%);}
  .discard-btn{
    width:100%; font-size:8.5px; padding:2px 0; margin-top:4px; border-radius:2px;
    background:var(--bg-soft); color:var(--text-dim); border:1px solid var(--border);
  }
  .discard-btn:hover:not(:disabled){background:var(--gold-soft); color:#2b2620;}
  .discard-btn:disabled{opacity:.35; cursor:not-allowed;}

  /* ---- hand ---- */
  .hand-row{display:flex; gap:8px; flex-wrap:wrap; padding:8px 0;}

  .controls{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0 4px;
  }
  button{
    font-family:inherit; font-size:13px; padding:7px 14px; border-radius:3px;
    border:1px solid var(--border-strong); background:var(--card-bg); color:var(--text); cursor:pointer;
  }
  button:hover:not(:disabled){background:var(--gold-soft); color:#2b2620;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  button.primary{background:var(--red); color:#f7f1e3; border-color:var(--red);}
  button.primary:hover:not(:disabled){background:var(--red-soft);}
  button.evolve{background:var(--green); color:#f7f1e3; border-color:var(--green);}
  button.evolve:hover:not(:disabled){background:var(--green-soft);}

  .hint{font-size:12px; color:var(--text-dim); min-height:18px;}

  #log{
    background:var(--bg-soft); border:1px solid var(--border); border-radius:3px;
    padding:8px 12px; font-size:12px; color:var(--text-dim); max-height:130px; overflow-y:auto;
    margin-top:10px;
  }
  #log div{padding:1px 0; border-bottom:1px dotted var(--border);}
  #log div:last-child{border-bottom:none;}

  .section-label{font-size:12px; color:var(--text-dim); margin:10px 0 4px; letter-spacing:.05em;}

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;
    z-index:150; padding:16px;
  }
  .modal{
    background:var(--card-bg); border:1px solid var(--border-strong); border-radius:4px; padding:18px;
    max-width:360px; width:100%; text-align:center;
    max-height:85vh; overflow-y:auto;
  }
  .modal h3{margin-bottom:10px;}
  .modal .row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:12px;}
  .rules-section{text-align:left;}

  /* ---- battle layout (two fields + core card per side) ---- */
  .side-info{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--bg-soft); border:1px solid var(--border);
    padding:8px 12px; border-radius:3px; margin-bottom:6px;
  }
  .side-info h2{font-size:14px; min-width:56px;}
  .side-info .core-hp{flex:1 1 140px; min-width:120px; display:flex; align-items:center; gap:6px;}
  #ai-core-hp{cursor:pointer;}
  #ai-core-hp:hover .core-icon{outline:2px solid var(--red-soft); outline-offset:2px; border-radius:50%;}
  .side-info .core-hp .core-hp-inner{flex:1; min-width:0;}
  .energy-pips{display:inline-flex; gap:3px; align-items:center;}
  .energy-pip{
    width:11px; height:11px; transform:rotate(45deg); border-radius:2px;
    background:var(--card-bg-locked); border:1px solid var(--border-strong);
  }
  .energy-pip.filled{ background:linear-gradient(145deg,#7fd0ff,#2b7fd6); border-color:#2b7fd6; box-shadow:0 0 4px rgba(90,180,255,.7); }

  .battle-row{ display:flex; gap:8px; align-items:stretch; margin-bottom:8px; }
  .policy-row{ display:flex; gap:6px; overflow-x:auto; padding:2px 0; margin-bottom:6px; }
  .policy-row:empty{ display:none; }
  .policy-chip{ flex:0 0 auto; width:86px; min-height:auto; padding:5px 6px; cursor:pointer; }
  .policy-chip .name{font-size:10.5px;}
  .policy-duration{
    font-size:10px; font-weight:700; color:var(--gold-soft); margin-top:3px;
    border-top:1px dashed var(--border); padding-top:3px;
  }
  .field-box{
    flex:1 1 0; min-width:0; border-radius:4px; overflow:hidden;
    border:1px solid var(--border); background-size:cover; background-position:center; position:relative;
  }
  .field-box::before{ content:""; position:absolute; inset:0; background:rgba(10,14,10,0.42); }
  .field-box .field-head{
    position:relative; z-index:1; font-size:11px; color:#f0ead8; padding:4px 8px;
    background:rgba(10,14,20,0.55); display:flex; align-items:center; gap:4px; text-shadow:0 1px 2px rgba(0,0,0,.8);
  }
  .terrain-change-btn{
    margin-left:auto; font-size:9.5px; padding:2px 6px; border-radius:3px; border:1px solid var(--gold-soft);
    background:rgba(163,120,28,0.3); color:#f0ead8; cursor:pointer; text-shadow:none;
  }
  .terrain-change-btn:hover{ background:var(--gold-soft); color:#2b2620; }
  .terrain-change-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .field-slots{
    position:relative; z-index:1; display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:6px;
  }
  /* field cards must fit their grid cell instead of the fixed hand-card width */
  .field-slots .card{
    width:100%; min-width:0; min-height:92px; padding:4px 5px; overflow:hidden;
  }
  .field-slots .card .name{font-size:10.5px; margin-bottom:2px;}
  .field-slots .card .type{font-size:8px; margin-bottom:2px;}
  .field-slots .card .stats{font-size:9.5px;}
  .field-slots .card .dur{font-size:8px;}
  .field-slots .card .blk{top:-6px; right:-6px; font-size:11px;}
  .field-slots .info-btn{
    top:-8px; left:-8px; right:auto; bottom:auto; transform:none;
    width:20px; height:20px; font-size:12px;
  }
  .field-slot-empty{
    min-height:92px; border:1px dashed rgba(240,234,216,0.45); border-radius:4px;
    display:flex; align-items:center; justify-content:center; color:rgba(240,234,216,0.5); font-size:20px;
  }
  @media (max-width:600px){
    .card{width:92px; min-height:104px;}
    .field-slot-empty{min-height:80px;}
  }

  /* ---- title screen ---- */
  #title-screen{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column;
    background:#0a1420;
  }
  #title-art{
    flex:1 1 auto; min-height:0;
    background-size:contain; background-repeat:no-repeat; background-position:center;
    background-color:#0a1420;
    position:relative;
  }
  #title-art::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:70px;
    background:linear-gradient(180deg, rgba(10,20,32,0) 0%, #0a1420 100%);
    pointer-events:none;
  }
  #title-menu-panel{
    flex:0 0 auto; position:relative;
    background:radial-gradient(ellipse at top, #10192a 0%, #060d16 70%);
    padding:18px 16px calc(20px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center;
  }
  #title-menu-panel::before{
    content:""; position:absolute; top:0; left:10%; right:10%; height:1px;
    background:linear-gradient(90deg, transparent, #c9a227, transparent);
  }
  #title-screen .menu{
    display:flex; flex-direction:column; gap:9px; width:min(320px,84vw);
    animation: titleMenuIn .5s ease-out;
  }
  @keyframes titleMenuIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  #title-screen button{
    font-family:'Shippori Mincho','Noto Serif JP',serif; letter-spacing:.12em;
    padding:11px 20px; border:1px solid #6b5d42; background:rgba(20,28,48,0.75); color:#d8cfb8;
    cursor:pointer; position:relative; transition:background .15s, border-color .15s, transform .1s;
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%);
    font-size:14.5px;
  }
  #title-screen button:active{ transform:scale(.98); }
  #title-screen button:hover{ background:rgba(163,120,28,0.3); border-color:#e0b94a; color:#fff6df; }
  #title-screen button.main{
    background:linear-gradient(180deg, rgba(60,100,170,0.9), rgba(30,58,110,0.9));
    border-color:#7fb2ff; color:#fff;
    box-shadow:0 0 18px rgba(127,178,255,0.45), inset 0 0 12px rgba(127,178,255,0.15);
    font-size:17px; padding:14px 20px; font-weight:700;
  }
  #title-screen button.main:hover{ background:linear-gradient(180deg, rgba(80,120,190,0.95), rgba(45,78,140,0.95)); }
  #title-screen button.sub{ font-size:13px; padding:9px 18px; color:#b3a68a; background:rgba(14,20,34,0.6); }
  #title-screen .menu-divider{
    display:flex; align-items:center; gap:8px; margin:3px 0; color:#6b5d42; font-size:11px;
  }
  #title-screen .menu-divider::before, #title-screen .menu-divider::after{
    content:""; flex:1; height:1px; background:#3a3324;
  }
  #game-wrap{ display:none; }

  /* ---- deck builder ---- */
  #deckbuilder-screen{
    display:none; position:fixed; inset:0; z-index:110; background:#141019;
    flex-direction:column; color:#EAE1CC; font-family:'Noto Serif JP',serif;
  }
  #deckbuilder-header{
    flex:0 0 auto; padding:12px 14px 8px; border-bottom:1px solid var(--border);
  }
  #deckbuilder-header h2{font-size:17px; margin-bottom:4px;}
  #deckbuilder-tabs{display:flex; gap:6px; margin-bottom:6px;}
  .db-tab{
    flex:1 1 auto; padding:7px 4px; font-size:13px; border-radius:4px; border:1px solid var(--border-strong);
    background:var(--card-bg); color:#EAE1CC; cursor:pointer;
  }
  .db-tab.active{ background:var(--gold-soft); color:#2b2620; border-color:var(--gold-soft); }
  #deckbuilder-count{font-size:13px; color:var(--gold-soft);}
  #deckbuilder-msg{font-size:12px; color:var(--red-soft); min-height:16px;}
  #deckbuilder-list{ flex:1 1 auto; overflow-y:auto; padding:8px 14px; }
  .db-era-header{
    font-size:13px; color:var(--gold-soft); border-bottom:1px solid var(--border); margin:10px 0 4px; padding-bottom:2px;
  }
  .db-row{
    display:flex; align-items:flex-start; gap:8px; padding:7px 4px; border-bottom:1px solid rgba(255,255,255,0.06);
    font-size:13px; cursor:pointer;
  }
  .db-row input{width:16px; height:16px; flex:0 0 auto; margin-top:3px;}
  .db-main{flex:1 1 auto; min-width:0;}
  .db-toprow{display:flex; align-items:center; gap:8px;}
  .db-cost{
    width:20px; height:20px; border-radius:50%; background:var(--gold-soft); color:#2b2620;
    font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .db-name{flex:1 1 auto;}
  .db-type{font-size:11px; color:var(--text-dim); flex:0 0 auto;}
  .db-effect{font-size:11px; color:var(--text-dim); margin-top:2px; line-height:1.35;}
  .db-effect b{color:var(--gold-soft); font-weight:700;}
  .db-info-btn{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%; background:var(--bg-soft); color:#EAE1CC;
    border:1px solid var(--border-strong); font-size:11px; line-height:1; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-style:italic; font-family:Georgia,serif;
    margin-top:2px;
  }
  .db-info-btn:hover{ background:var(--gold-soft); color:#2b2620; }
  #deckbuilder-footer{
    flex:0 0 auto; display:flex; gap:8px; flex-wrap:wrap; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border); background:#0f0c14;
  }
  #deckbuilder-footer button{ flex:1 1 auto; }

  /* small inline icon images used throughout the HUD */
  .icon-img{ display:inline-block; vertical-align:middle; border-radius:50%; object-fit:cover; }
  .core-icon{ width:30px; height:30px; margin-right:6px; }
  .stat-icon{ width:16px; height:16px; margin-right:3px; }
  .badge-icon{ width:14px; height:14px; margin-right:3px; border-radius:50%; object-fit:cover; }
  .deck-icon{ width:18px; height:25px; border-radius:2px; margin-right:4px; vertical-align:middle; }

  /* attack flash: positioned/rotated per-attack via JS to point from attacker to target */
  #attack-flash{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:260px; z-index:200; pointer-events:none; opacity:0; border-radius:8px;
    transform-origin:center center;
  }
  #attack-flash.show{ animation: flashpop .45s ease-out; }
  @keyframes flashpop{
    0%{opacity:0;}
    35%{opacity:1;}
    100%{opacity:0;}
  }
</style>
</head>
<body>

<div id="title-screen">
  <div id="title-art"></div>
  <div id="title-menu-panel">
    <div class="menu">
      <button class="main" id="btn-title-start">⚔️ はじめる</button>
      <button id="btn-title-continue">↻ つづきから</button>

function flagHtml(d){
  if(!d.flag) return '';
  if(CUSTOM_FLAG_IMAGES[d.flag]) return `<img class="card-flag-img" src="${CUSTOM_FLAG_IMAGES[d.flag]}" alt="">`;
  return `<span class="card-flag">${d.flag}</span>`;
}

// WLP needed to evolve OUT of a given era: era1(古代)=200, era2(中世)=300, era3(近世)=400 ...
// each subsequent era's requirement is 100 more than the last.
function wlpThresholdFor(era){ return 100 + 100*era; }

let uidCounter = 1;
function nextUid(){ return 'u' + (uidCounter++); }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// build a shuffled deck from a list of unique card ids (no duplicates: each id appears once).
function buildDeckFromList(ids){
  return shuffle(ids.slice());
}

// build this player's deck for their CURRENT era only (the deck is fully replaced on every
// era advance — old-era cards are no longer drawable, matching the "old era cards can only be
// discarded for energy" rule). Uses the player's own per-era custom deck if they built one via
// the deck builder (owner.customDecks[era]), otherwise auto-builds from every card of that era.
function buildEraDeck(owner){
  const era = owner.era;
  let source;
  if(owner.customDecks && owner.customDecks[era] && owner.customDecks[era].length>0){
    source = owner.customDecks[era];
  } else {
    source = CARD_DB.filter(c=>c.era===era).map(c=>c.id);
  }
  return shuffle(source.slice());
}

  forest:   {name:'森林', icon:'🌲', desc:'この地形の偉人は、最初に受けるダメージ-2。'},
  water:    {name:'水域', icon:'🌊', desc:'自分の建物・政策のコスト-1(いずれかの地形が水域の間)。'},
};

function newPlayerState(name){
  return {
    name,
    coreHp: START_CORE_HP,
    coreShield: ANCIENT_SHIELD,
    maxEnergy: 1,
    energy: 1,
    era: 1,
    eraStartTurn: 1,
    wlp: 0,
    debuffTurns: 0,
    deck: [],           // the shuffled working pile drawn from (rebuilt fresh each era advance)
    customDecks: null,  // {1:[ids],2:[ids],3:[ids]} — this player's own per-era deck choices, if any
    graveyard: [],       // ids of this player's own destroyed buildings (for 再興)
    policies: [],        // active persistent policies: {uid, cardId, duration}
    hand: [],
    fields: { f1: {terrain:'water', cards:[]}, f2: {terrain:'plains', cards:[]} },
    energyUpUsedThisTurn: false,
    terrainChangedThisTurn: false,
    negateDebuffUsedThisTurn: false,
    sakokuUsedThisTurn: false,
  };
}

// helper: every card currently on the field (both f1 and f2), combined
function allFieldCards(owner){
  return owner.fields.f1.cards.concat(owner.fields.f2.cards);
}
// locate a field card by uid across both sub-fields; returns {card, key} or null
function findFieldCard(owner, uid){
  let card = owner.fields.f1.cards.find(f=>f.uid===uid);
  if(card) return {card, key:'f1'};
  card = owner.fields.f2.cards.find(f=>f.uid===uid);
  if(card) return {card, key:'f2'};
  return null;
}
// does this card definition carry the given keyword ability?
function hasSpecial(d, name){
  return !!(d && d.specials && d.specials.includes(name));
}
// cost of a card to play: 水域(water) terrain gives buildings & policies -1, while the
// player has at least one field set to water
function effectiveCost(owner, d){
  let cost = d.cost;
  if(d.type==='building' || d.type==='policy'){
    const hasWater = owner.fields.f1.terrain==='water' || owner.fields.f2.terrain==='water';
    if(hasWater) cost -= 1;
  }
  return Math.max(0, cost);
}

// apply/remove a field's sticky terrain bonuses (plains ATK+1, mountain HP+3) for one card
function applyTerrainBonusOnEntry(f, terrain){
  const d = cardDef(f.cardId);
  if(d.type!=='person') return;
  if(terrain==='plains' && !f.plainsBonus){ f.atk += 1; f.plainsBonus = true; }
  if(terrain==='mountain' && !f.mountainBonus){ f.hp += 3; f.maxHp += 3; f.mountainBonus = true; }
}
function removeTerrainBonusOnExit(f, terrain){
  const d = cardDef(f.cardId);
  if(d.type!=='person') return;
  if(terrain==='plains' && f.plainsBonus){ f.atk = Math.max(0, f.atk-1); f.plainsBonus = false; }
  if(terrain==='mountain' && f.mountainBonus){ f.hp = Math.max(1, f.hp-3); f.maxHp = Math.max(1, f.maxHp-3); f.mountainBonus = false; }
}
// change one of the player's own fields to a new terrain, costs 1 Energy, once per turn
function changeTerrain(owner, fieldKey, newTerrain){
  const field = owner.fields[fieldKey];
  if(field.terrain === newTerrain) return false;
  if(owner.terrainChangedThisTurn || owner.energy<1) return false;
  const oldTerrain = field.terrain;
  field.cards.forEach(f=>{
    removeTerrainBonusOnExit(f, oldTerrain);
    applyTerrainBonusOnEntry(f, newTerrain);
  });
  field.terrain = newTerrain;
  owner.energy -= 1;
  owner.terrainChangedThisTurn = true;
  return true;
}

let state = {
  turnNumber: 1,
  active: 'player', // 'player' | 'ai'
  player: newPlayerState('あなた'),
  ai: newPlayerState('相手'),
  selected: null, // uid of selected hand card or field attacker
  selectMode: null, // 'hand' | 'attack'
  gameOver: false,
};

function cardDef(id){ return CARD_DB.find(c=>c.id===id); }

function log(msg){
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.textContent = msg;
  el.prepend(line);
}

function drawCard(p, n){
  for(let i=0;i<n;i++){
    if(state.gameOver) return;
    if(p.hand.length >= HAND_MAX) { if(p===state.player) log('手札が上限のため引けませんでした。'); continue; }
    if(p.deck.length===0){
      // deck-out: running out of cards to draw is an immediate loss for that side
      const playerLost = (p === state.player);
      state.gameOver = true;
      log(playerLost ? '=== あなたの山札が尽きた。敗北。===' : '=== 相手の山札が尽きた！勝利！===');
      showGameOverModal(!playerLost);
      return;
    }
    const id = p.deck.pop();
    p.hand.push(id);
  }
}

function startGame(){
  drawCard(state.player, 7);
  drawCard(state.ai, 7);
  log('--- ゲーム開始 ---');
  log('あなたの手番です。');
  render();
}

// ---------- effect resolution ----------
function applyEffect(owner, opponent, effect){
  if(!effect) return;
  if(effect.kind==='heal'){
    owner.coreHp = Math.min(START_CORE_HP, owner.coreHp + effect.amount);
    log(`${owner.name}: Coreが${effect.amount}回復した。`);
  } else if(effect.kind==='draw'){
    let amt = effect.amount;
    // 鎖国(海禁): the opponent can shave 1 off this draw, once per their turn-cycle
    if(opponent && hasActivePolicySpecial(opponent,'policy_reduce_enemy_draw') && !opponent.sakokuUsedThisTurn){
      opponent.sakokuUsedThisTurn = true;
      amt = Math.max(0, amt-1);
      log(`${opponent.name}の鎖国(海禁)で${owner.name}のドロー枚数が1枚減った。`);
    }
    if(amt>0) drawCard(owner, amt);
    log(`${owner.name}: カードを${amt}枚引いた。`);
  } else if(effect.kind==='energyUp'){
    owner.maxEnergy = Math.min(10, owner.maxEnergy + effect.amount);
    log(`${owner.name}: Energy上限が${effect.amount}上がった。`);
  } else if(effect.kind==='buffAtk'){
    allFieldCards(owner).forEach(f=>{ const d=cardDef(f.cardId); if(d.type==='person'){ f.atk += effect.amount; }});
    log(`${owner.name}: 自軍の偉人の攻撃力が+${effect.amount}された。`);
  } else if(effect.kind==='wlp'){
    gainWlp(owner, effect.amount);
    log(`${owner.name}: WLPが+${effect.amount}された。`);
  } else if(effect.kind==='tutor'){
    owner.deck = shuffle(owner.deck);
    const idx = owner.deck.findIndex(id=>{ const d=cardDef(id); return d.type==='person' && d.era<=owner.era; });
    if(idx>=0 && owner.hand.length<HAND_MAX){
      const [pickedId] = owner.deck.splice(idx,1);
      owner.hand.push(pickedId);
      log(`${owner.name}: デッキから「${cardDef(pickedId).name}」を手札に加えた。`);
    } else {
      log(`${owner.name}: デッキに加えられる偉人が見つからなかった。`);
    }
  }
}

function gainWlp(owner, amount){
  if(owner.debuffTurns>0){ amount = Math.max(0, amount-4); } // social issue slows progress a bit
  owner.wlp += amount;
}

// ---------- playing cards ----------
function canPlay(owner, cardId, key){
  const d = cardDef(cardId);
  if(!d) return false;
  // only cards matching the player's CURRENT era can be played — once the era moves on,
  // older-era cards left in hand are "obsolete" and can only be discarded for energy.
  if(d.era !== owner.era) return false;
  if(effectiveCost(owner, d) > owner.energy) return false;
  if(d.type==='person'||d.type==='building'){
    if(key){
      if(owner.fields[key].cards.length >= FIELD_MAX) return false;
    } else {
      // no specific field requested: playable if EITHER field has room
      if(owner.fields.f1.cards.length >= FIELD_MAX && owner.fields.f2.cards.length >= FIELD_MAX) return false;
    }
  }
  if(d.type==='policy' && owner.policies.length >= POLICY_MAX) return false;
  return true;
}

// which fields (of 'f1'/'f2') currently have an open slot
function openFieldKeys(owner){
  return ['f1','f2'].filter(k=>owner.fields[k].cards.length < FIELD_MAX);
}

function playCard(owner, opponent, handIndex, chosenKey){
  const cardId = owner.hand[handIndex];
  const d = cardDef(cardId);
  if(!canPlay(owner, cardId, chosenKey)) return false;
  const cost = effectiveCost(owner, d);
  const discounted = cost < d.cost;
  owner.energy -= cost;
  owner.hand.splice(handIndex,1);

  let placedCard = null;
  if(d.type==='person'){
    const key = chosenKey || (owner.fields.f1.cards.length<FIELD_MAX ? 'f1' : 'f2');
    const fieldLabel = key==='f1' ? 'フィールド1' : 'フィールド2';
    placedCard = {uid:nextUid(), cardId, atk:d.atk, hp:d.hp, maxHp:d.hp, shield:0, sick:!hasSpecial(d,'kishu'), attacked:false, usedFirstAttackBonus:false, usedFukutsu:false, usedOuken:false, tookFirstHit:false, plainsBonus:false, mountainBonus:false};
    owner.fields[key].cards.push(placedCard);
    applyTerrainBonusOnEntry(placedCard, owner.fields[key].terrain);
    log(`${owner.name}: 「${d.name}」を${fieldLabel}(${TERRAIN_DEFS[owner.fields[key].terrain].name})に出した。${discounted?'(割引適用)':''}`);
    // if this field already has a shield-granting building, the new arrival gets a shield too
    const shieldBuilding = owner.fields[key].cards.find(c=>{ const cd=cardDef(c.cardId); return cd.type==='building' && cd.grantsShield; });
    if(shieldBuilding){
      const sd = cardDef(shieldBuilding.cardId);
      placedCard.shield += sd.grantsShield;
      log(`${owner.name}の「${d.name}」は「${sd.name}」の加護でシールド${sd.grantsShield}を得た。`);
    }
    // if this field already has an HP-aura building, the new arrival gets that HP bonus too
    owner.fields[key].cards.forEach(c=>{
      if(c.uid===placedCard.uid) return;
      const cd = cardDef(c.cardId);
      if(cd.type==='building' && cd.aura && cd.aura.hp){
        placedCard.hp += cd.aura.hp; placedCard.maxHp += cd.aura.hp;
        log(`${owner.name}の「${d.name}」は「${cd.name}」の加護でHP+${cd.aura.hp}。`);
      }
    });

    // 号令: same-field allies get +3 ATK
    if(hasSpecial(d,'gourei')){
      owner.fields[key].cards.forEach(f=>{
        if(f.uid===placedCard.uid) return;
        const fd = cardDef(f.cardId);
        if(fd.type==='person'){ f.atk+=3; }
      });
      log(`${owner.name}の「${d.name}」の号令で同じフィールドの味方のATK+3。`);
    }
    // 守勢: same-field allies get +3 HP
    if(hasSpecial(d,'shusei')){
      owner.fields[key].cards.forEach(f=>{
        if(f.uid===placedCard.uid) return;
        const fd = cardDef(f.cardId);
        if(fd.type==='person'){ f.hp+=3; f.maxHp+=3; }
      });
      log(`${owner.name}の「${d.name}」の守勢で同じフィールドの味方のHP+3。`);
    }
    // 外交: lower one enemy person's ATK by 2. The player picks the target themselves
    // when there's a real choice; otherwise (AI, or only one option) it's automatic.
    if(hasSpecial(d,'gaikou')){
      const enemyPersons = allFieldCards(opponent).filter(f=>cardDef(f.cardId).type==='person');
      if(enemyPersons.length>1 && owner===state.player){
        promptGaikouTarget(d, owner, opponent, enemyPersons);
      } else if(enemyPersons.length>0){
        const t = enemyPersons.length===1 ? enemyPersons[0] : enemyPersons.reduce((a,b)=> b.atk>a.atk ? b : a, enemyPersons[0]);
        applyGaikou(d, owner, opponent, t);
      }
    }
    // 開拓: draw a card (skip if this card's own effect already draws, to avoid stacking)
    if(hasSpecial(d,'kaitaku') && !(d.effect && d.effect.kind==='draw')){
      drawCard(owner, 1);
      log(`${owner.name}の「${d.name}」の開拓でカードを1枚引いた。`);
    }
    // 再興: bring one destroyed building back from the graveyard, at full HP. The player
    // picks which one themselves when there's a real choice.
    if(hasSpecial(d,'saikou')){
      const buildingEntries = owner.graveyard
        .map((cid,idx)=>({cid,idx}))
        .filter(e=>cardDef(e.cid).type==='building');
      if(buildingEntries.length>1 && owner===state.player){
        promptSaikouTarget(d, owner, buildingEntries);
      } else if(buildingEntries.length>0){
        applySaikou(d, owner, buildingEntries[buildingEntries.length-1].idx);
      }
    }
  } else if(d.type==='building'){
    const key = chosenKey || (owner.fields.f1.cards.length<FIELD_MAX ? 'f1' : 'f2');
    const fieldLabel = key==='f1' ? 'フィールド1' : 'フィールド2';
    placedCard = {uid:nextUid(), cardId, hp:d.hp, maxHp:d.hp, sick:false, attacked:false, atk:0, turnsOnField:0, playedThisTurn:true};
    owner.fields[key].cards.push(placedCard);
    log(`${owner.name}: 「${d.name}」を${fieldLabel}(${TERRAIN_DEFS[owner.fields[key].terrain].name})に建設した。${discounted?'(割引適用)':''}`);
    gainWlp(owner, 10);
    // grantsShield: give every person already in this field a shield right away
    if(d.grantsShield){
      owner.fields[key].cards.forEach(c=>{
        if(c.uid===placedCard.uid) return;
        const cd = cardDef(c.cardId);
        if(cd.type==='person'){ c.shield += d.grantsShield; }
      });
      log(`${owner.name}の「${d.name}」が同じフィールドの偉人にシールド${d.grantsShield}を付与した。`);
    }
    // aura.hp: give every person already in this field that HP bonus right away
    if(d.aura && d.aura.hp){
      owner.fields[key].cards.forEach(c=>{
        if(c.uid===placedCard.uid) return;
        const cd = cardDef(c.cardId);
        if(cd.type==='person'){ c.hp += d.aura.hp; c.maxHp += d.aura.hp; }
      });
      log(`${owner.name}の「${d.name}」が同じフィールドの偉人のHPを+${d.aura.hp}した。`);
    }
    // onPlayHpBuff (信仰の結集 etc): one-time HP buff to same-field allies on play
    if(d.onPlayHpBuff){
      owner.fields[key].cards.forEach(c=>{
        if(c.uid===placedCard.uid) return;
        const cd = cardDef(c.cardId);
        if(cd.type==='person'){ c.hp += d.onPlayHpBuff; c.maxHp += d.onPlayHpBuff; }
      });
      log(`${owner.name}の「${d.name}」が同じフィールドの偉人のHPを+${d.onPlayHpBuff}した。`);
    }
    // building_gourei2 (天下布武 etc): one-time ATK+2 to same-field allies on play
    if(hasSpecial(d,'building_gourei2')){
      owner.fields[key].cards.forEach(c=>{
        if(c.uid===placedCard.uid) return;
        const cd = cardDef(c.cardId);
        if(cd.type==='person'){ c.atk += 2; }
      });
      log(`${owner.name}の「${d.name}」が同じフィールドの偉人の攻撃力を+2した。`);
    }
    // building_court_culture (宮廷文化): draw1 already via d.effect; also heal+3 if hand has a policy card
    if(hasSpecial(d,'building_court_culture')){
      const hasPolicyInHand = owner.hand.some(cid=>cardDef(cid).type==='policy');
      if(hasPolicyInHand){
        owner.coreHp = Math.min(START_CORE_HP, owner.coreHp + 3);
        log(`${owner.name}の「${d.name}」:手札に政策があるためCoreを3回復した。`);
      }
    }
  } else if(d.type==='policy'){
    const duration = d.duration || 3;
    log(`${owner.name}: 政策「${d.name}」を制定した。${discounted?'(割引適用)':''}(持続${duration}ターン)`);
    gainWlp(owner, 10);
    const polInstance = {uid:nextUid(), cardId, duration};
    owner.policies.push(polInstance);
    // 封建制: choose an anchor person; while it survives, same-field allies get ATK+2
    if(hasSpecial(d,'policy_feudal_anchor')){
      const ownPersons = allFieldCards(owner).filter(c=>cardDef(c.cardId).type==='person');
      if(ownPersons.length>1 && owner===state.player){
        promptFeudalAnchor(d, owner, polInstance, ownPersons);
      } else if(ownPersons.length>0){
        polInstance.anchorUid = ownPersons[0].uid;
        log(`${owner.name}の「${d.name}」の主従の契約:「${cardDef(ownPersons[0].cardId).name}」を主に選んだ。`);
      }
    }
  }

  if(d.effect && d.effect.trigger==='play'){
    applyEffect(owner, opponent, d.effect);
  }
  return true;
}

// does this player have an active policy carrying the given keyword/tag?
function hasActivePolicySpecial(owner, name){
  return owner.policies.some(pol=>hasSpecial(cardDef(pol.cardId), name));
}

// 外交: apply the -2 ATK to a chosen enemy person (十二表法 can negate this once per turn)
function applyGaikou(d, owner, opponent, target){
  if(hasActivePolicySpecial(opponent,'policy_negate_debuff') && !opponent.negateDebuffUsedThisTurn){
    opponent.negateDebuffUsedThisTurn = true;
    log(`${opponent.name}の「十二表法」が${owner.name}の「${d.name}」の外交(ATK低下)を無効化した！`);
    return;
  }
  target.atk = Math.max(0, target.atk-2);
  log(`${owner.name}の「${d.name}」の外交で${opponent.name}の「${cardDef(target.cardId).name}」のATK-2。`);
}
// 外交: let the player pick which enemy person to target
function promptGaikouTarget(d, owner, opponent, enemyPersons){
  const overlay = document.getElementById('overlay');
  document.getElementById('modal-title').textContent = `外交:ATK-2する相手を選んでください`;
  document.getElementById('modal-body').textContent = `「${d.name}」の効果です。`;
  const buttons = document.getElementById('modal-buttons');
  buttons.innerHTML = '';
  enemyPersons.forEach(t=>{
    const td = cardDef(t.cardId);
    const btn = document.createElement('button');
    btn.textContent = `${td.name}(ATK${t.atk}/HP${t.hp})`;
    btn.onclick = ()=>{
      overlay.style.display = 'none';
      applyGaikou(d, owner, opponent, t);
      render();
    };
    buttons.appendChild(btn);
  });
  overlay.style.display = 'flex';
}
// 封建制: let the player pick which of their own persons becomes the anchor
function promptFeudalAnchor(d, owner, polInstance, ownPersons){
  const overlay = document.getElementById('overlay');
  document.getElementById('modal-title').textContent = `封建制:主となる偉人を選んでください`;
  document.getElementById('modal-body').textContent = `「${d.name}」の効果です。選んだ偉人が場にいる間、同じフィールドの他の味方の攻撃力+2。`;
  const buttons = document.getElementById('modal-buttons');
  buttons.innerHTML = '';
  ownPersons.forEach(t=>{
    const td = cardDef(t.cardId);
    const btn = document.createElement('button');
    btn.textContent = `${td.name}(ATK${t.atk}/HP${t.hp})`;
    btn.onclick = ()=>{
      overlay.style.display = 'none';
      polInstance.anchorUid = t.uid;
      log(`${owner.name}の「${d.name}」の主従の契約:「${td.name}」を主に選んだ。`);
      render();
    };
    buttons.appendChild(btn);
  });
  overlay.style.display = 'flex';
}
// 安土城の還元: let the player pick which own person gets the ATK buff
function promptKangenAtkTarget(d, owner, ownPersons, amt){
  const overlay = document.getElementById('overlay');
  document.getElementById('modal-title').textContent = `還元:ATK+${amt}する偉人を選んでください`;
  document.getElementById('modal-body').textContent = `「${d.name}」の効果です。`;
  const buttons = document.getElementById('modal-buttons');
  buttons.innerHTML = '';
  ownPersons.forEach(t=>{
    const td = cardDef(t.cardId);
    const btn = document.createElement('button');
    btn.textContent = `${td.name}(ATK${t.atk}/HP${t.hp})`;
    btn.onclick = ()=>{
      overlay.style.display = 'none';
      t.atk += amt;
      log(`${owner.name}の「${d.name}」の還元で「${td.name}」のATK+${amt}。`);
      render();
    };
    buttons.appendChild(btn);
  });
  overlay.style.display = 'flex';
}
// 再興: revive the building at this graveyard index, back onto the field at full HP
function applySaikou(d, owner, graveyardIdx){
  const [revivedId] = owner.graveyard.splice(graveyardIdx, 1);
  const rd = cardDef(revivedId);
  const rkey = owner.fields.f1.cards.length<FIELD_MAX ? 'f1' : 'f2';
  if(owner.fields[rkey].cards.length < FIELD_MAX){
    owner.fields[rkey].cards.push({uid:nextUid(), cardId:revivedId, hp:rd.hp, maxHp:rd.hp, sick:false, attacked:false, atk:0});
    log(`${owner.name}の「${d.name}」の再興で「${rd.name}」が場に戻った！`);
  } else {
    owner.graveyard.push(revivedId); // put it back, no room this time
  }
}
// 再興: let the player pick which destroyed building to bring back
function promptSaikouTarget(d, owner, buildingEntries){
  const overlay = document.getElementById('overlay');
  document.getElementById('modal-title').textContent = `再興:場に戻す建物を選んでください`;
  document.getElementById('modal-body').textContent = `「${d.name}」の効果です。`;
  const buttons = document.getElementById('modal-buttons');
  buttons.innerHTML = '';
  buildingEntries.forEach(e=>{
    const rd = cardDef(e.cid);
    const btn = document.createElement('button');
    btn.textContent = `${rd.name}(HP${rd.hp})`;
    btn.onclick = ()=>{
      overlay.style.display = 'none';
      applySaikou(d, owner, e.idx);
      render();
    };
    buttons.appendChild(btn);
  });
  overlay.style.display = 'flex';
}

// 始皇帝陵の還元: bring one destroyed PERSON back from the graveyard, at full HP
function applyRevivePerson(owner, graveyardIdx){
  const [revivedId] = owner.graveyard.splice(graveyardIdx, 1);
  const rd = cardDef(revivedId);
  const rkey = owner.fields.f1.cards.length<FIELD_MAX ? 'f1' : 'f2';
  if(owner.fields[rkey].cards.length < FIELD_MAX){
    const newCard = {uid:nextUid(), cardId:revivedId, atk:rd.atk, hp:rd.hp, maxHp:rd.hp, shield:0, sick:true, attacked:false, usedFirstAttackBonus:false, usedFukutsu:false, usedOuken:false, tookFirstHit:false, plainsBonus:false, mountainBonus:false};
    owner.fields[rkey].cards.push(newCard);
    applyTerrainBonusOnEntry(newCard, owner.fields[rkey].terrain);
    log(`${owner.name}の始皇帝陵の還元で「${rd.name}」がHP満タンで復活した！`);
  } else {
    owner.graveyard.push(revivedId); // put it back, no room this time
  }
}
function promptRevivePersonTarget(owner, personEntries){
  const overlay = document.getElementById('overlay');
  document.getElementById('modal-title').textContent = `還元:復活させる偉人を選んでください`;
  document.getElementById('modal-body').textContent = `始皇帝陵の効果です。`;
  const buttons = document.getElementById('modal-buttons');
  buttons.innerHTML = '';
  personEntries.forEach(e=>{
    const rd = cardDef(e.cid);
    const btn = document.createElement('button');
    btn.textContent = `${rd.name}(攻${rd.atk}/HP${rd.hp})`;
    btn.onclick = ()=>{
      overlay.style.display = 'none';
      applyRevivePerson(owner, e.idx);
      render();
    };
    buttons.appendChild(btn);
  });
  overlay.style.display = 'flex';
}

// ---------- attacking ----------
function livingBlockers(p){
  return allFieldCards(p).filter(f=>{
    const d = cardDef(f.cardId);
    return hasSpecial(d,'gokoku') && !f.attacked;
  });
}

// front-to-back targeting: フィールド1に偉人がいる間はそこしか攻撃できず、
// いなくなったらフィールド2、そこも偉人がいなくなって初めてCoreを狙える。
function attackableZoneKey(defenderOwner){
  if(defenderOwner.fields.f1.cards.some(f=>cardDef(f.cardId).type==='person')) return 'f1';
  if(defenderOwner.fields.f2.cards.some(f=>cardDef(f.cardId).type==='person')) return 'f2';
  return 'core';
}

// sum of ATK aura bonuses from buildings sharing this field (continuous while they survive)
function fieldAuraAtkBonus(owner, fieldKey){
  if(!fieldKey) return 0;
  let bonus = owner.fields[fieldKey].cards.reduce((sum,c)=>{
    const cd = cardDef(c.cardId);
    return sum + (cd.type==='building' && cd.aura && cd.aura.atk ? cd.aura.atk : 0);
  }, 0);
  // notredame-style: while 3+ persons share this field, an extra conditional aura kicks in
  const personCount = owner.fields[fieldKey].cards.filter(c=>cardDef(c.cardId).type==='person').length;
  owner.fields[fieldKey].cards.forEach(c=>{
    const cd = cardDef(c.cardId);
    if(cd.type==='building' && cd.auraThreshold && personCount>=cd.auraThreshold.count){
      bonus += cd.auraThreshold.atk;
    }
  });
  return bonus;
}

// 封建制: if this owner has an active anchor-policy and its chosen person still lives,
// other persons sharing that field get the bonus
function feudalAnchorBonus(owner, f){
  let bonus = 0;
  owner.policies.forEach(pol=>{
    const pd = cardDef(pol.cardId);
    if(!hasSpecial(pd,'policy_feudal_anchor') || !pol.anchorUid || pol.anchorUid===f.uid) return;
    const anchorLoc = findFieldCard(owner, pol.anchorUid);
    const myLoc = findFieldCard(owner, f.uid);
    if(anchorLoc && myLoc && anchorLoc.key===myLoc.key) bonus += 2;
  });
  return bonus;
}

function effectiveAtk(owner, f){
  const d = cardDef(f.cardId);
  let atk = f.atk;
  if(d.type==='person'){
    const loc = findFieldCard(owner, f.uid);
    if(loc) atk += fieldAuraAtkBonus(owner, loc.key);
    atk += feudalAnchorBonus(owner, f);
  }
  // 背水: at 10 HP or below, +5 attack
  if(hasSpecial(d,'haisui') && f.hp<=10) atk += 5;
  // 統一: while this player has persons in BOTH fields at once, +3 attack
  if(hasSpecial(d,'touitsu')){
    const f1HasPerson = owner.fields.f1.cards.some(c=>cardDef(c.cardId).type==='person');
    const f2HasPerson = owner.fields.f2.cards.some(c=>cardDef(c.cardId).type==='person');
    if(f1HasPerson && f2HasPerson) atk += 3;
  }
  // マグナ・カルタ: while the opponent has it active, 王権 persons get ATK-3
  if(hasSpecial(d,'ouken')){
    const opp = owner===state.player ? state.ai : state.player;
    if(hasActivePolicySpecial(opp,'policy_debuff_ouken3')) atk -= 3;
  }
  if(owner.debuffTurns>0) atk = Math.max(0, atk-1);
  return Math.max(0, atk);
}

function dealDamageToField(target, targetOwner, amount){
  const d = cardDef(target.cardId);
  // モン・サン=ミッシェル(潮の要塞): during the opponent's turn, the first damage this
  // field takes is fully negated (resets once control returns to this field's owner)
  {
    const loc00 = findFieldCard(targetOwner, target.uid);
    if(loc00){
      const field00 = targetOwner.fields[loc00.key];
      const ownerIsPlayer = targetOwner===state.player;
      const ownerActiveKey = ownerIsPlayer ? 'player' : 'ai';
      const isOpponentTurn = state.active !== ownerActiveKey;
      const hasFortress = field00.cards.some(c=>cardDef(c.cardId).tideFortress);
      if(hasFortress && isOpponentTurn && !field00.tideNegateUsed){
        field00.tideNegateUsed = true;
        log(`「${d.name}」への攻撃は、潮の要塞により無効化された！`);
        return 0;
      }
    }
  }
  // 森林: this card's first-ever hit of damage is reduced by 2
  if(d.type==='person' && !target.tookFirstHit){
    const loc0 = findFieldCard(targetOwner, target.uid);
    if(loc0 && targetOwner.fields[loc0.key].terrain==='forest'){
      amount = Math.max(0, amount-2);
      log(`「${d.name}」は森林の加護でダメージ-2。`);
    }
    target.tookFirstHit = true;
  }
  // a shield (from a shield-granting building) absorbs damage before HP does
  if(d.type==='person' && target.shield>0){
    const absorbed = Math.min(target.shield, amount);
    target.shield -= absorbed;
    amount -= absorbed;
    if(absorbed>0) log(`「${d.name}」のシールドが${absorbed}を吸収した。`);
  }
  target.hp -= amount;
  if(target.hp<=0){
    // 不屈: survive the first lethal hit with 1 HP, once per card
    if(d.type==='person' && hasSpecial(d,'fukutsu') && !target.usedFukutsu){
      target.usedFukutsu = true;
      target.hp = 1;
      log(`「${d.name}」は不屈の力でHP1で踏みとどまった！`);
      return amount;
    }
    const loc = findFieldCard(targetOwner, target.uid);
    if(loc){ targetOwner.fields[loc.key].cards = targetOwner.fields[loc.key].cards.filter(f=>f.uid!==target.uid); }
    targetOwner.graveyard.push(target.cardId);
    log(`「${d.name}」は破壊された。`);
  }
  return amount;
}

function attackCore(attackerOwner, attacker, defenderOwner){
  let dmg = effectiveAtk(attackerOwner, attacker);
  let shieldMsg = '';
  if(defenderOwner.coreShield>0){
    const absorbed = Math.min(defenderOwner.coreShield, dmg);
    defenderOwner.coreShield -= absorbed;
    dmg -= absorbed;
    shieldMsg = absorbed>0 ? `(盾が${absorbed}吸収)` : '';
  }
  defenderOwner.coreHp -= dmg;
  log(`${attackerOwner.name}の「${cardDef(attacker.cardId).name}」が${defenderOwner.name}のCoreに${dmg}ダメージ！${shieldMsg}`);
  gainWlp(attackerOwner, 10);
  const atkDef = cardDef(attacker.cardId);
  if(hasSpecial(atkDef,'ouken') && !attacker.usedOuken){
    attacker.usedOuken = true;
    gainWlp(attackerOwner, 10);
    log(`${attackerOwner.name}の「${atkDef.name}」の王権が発動！WLP+10。`);
  }
  checkGameOver();
}

function resolveAttack(attackerOwner, attacker, defenderOwner, target){
  // target: {kind:'core'} or {kind:'field', uid}
  attacker.attacked = true;
  showAttackFx(attacker, target, attackerOwner);
  if(target.kind==='core'){
    attackCore(attackerOwner, attacker, defenderOwner);
  } else {
    const loc = findFieldCard(defenderOwner, target.uid);
    if(!loc) return;
    const t = loc.card;
    const tDef = cardDef(t.cardId);
    const tAtkBeforeDeath = t.atk || 0;
    const dmg = effectiveAtk(attackerOwner, attacker);
    const attackerDef = cardDef(attacker.cardId);
    const isPersonAttacker = attackerDef.type==='person';
    const wasPerson = tDef.type==='person';
    // 砂漠(防御側): attacking a target standing in the defender's desert field costs the
    // attacker 1 HP, whether the target is a person or a building
    if(defenderOwner.fields[loc.key].terrain==='desert'){
      const attackerStillThere0 = findFieldCard(attackerOwner, attacker.uid);
      if(attackerStillThere0){
        dealDamageToField(attacker, attackerOwner, 1);
        log(`${defenderOwner.name}の砂漠の罠で、攻撃した${attackerOwner.name}の「${attackerDef.name}」がHP-1を受けた。`);
      }
    }
    const actualDmg = dealDamageToField(t, defenderOwner, dmg);
    const diedNow = !findFieldCard(defenderOwner, target.uid);
    // ハンムラビ法典: 自分の偉人が敵の偉人から受けるダメージの30%(切り捨て)を跳ね返す
    if(wasPerson && isPersonAttacker && hasActivePolicySpecial(defenderOwner,'policy_reflect30')){
      const reflectAmt = Math.floor((actualDmg||0) * 0.3);
      if(reflectAmt>0){
        const attackerStillThere1 = findFieldCard(attackerOwner, attacker.uid);
        if(attackerStillThere1){
          dealDamageToField(attacker, attackerOwner, reflectAmt);
          log(`${defenderOwner.name}のハンムラビ法典で、受けたダメージの30%(${reflectAmt})を${attackerOwner.name}の「${attackerDef.name}」に跳ね返した。`);
        }
      }
    }
    // return fire only if defender is a person (buildings don't fight back)
    if(wasPerson && isPersonAttacker && attacker.hp!==undefined){
      const stillThere = !diedNow;
      const backDmg = stillThere ? effectiveAtk(defenderOwner, t) : 0;
      if(backDmg>0){
        dealDamageToField(attacker, attackerOwner, backDmg);
      }
    }
    // 反攻: even if this card died from the hit, it still deals its attack power back
    if(wasPerson && diedNow && hasSpecial(tDef,'hangeki')){
      const stillAttacker1 = findFieldCard(attackerOwner, attacker.uid);
      if(stillAttacker1 && tAtkBeforeDeath>0){
        log(`${defenderOwner.name}の「${tDef.name}」が反攻！攻撃側に${tAtkBeforeDeath}ダメージ。`);
        dealDamageToField(attacker, attackerOwner, tAtkBeforeDeath);
      }
    }
    const attackerStillAlive = !!findFieldCard(attackerOwner, attacker.uid);
    // 征服: defeating an enemy person grants +3 ATK and a card draw
    if(wasPerson && diedNow && attackerStillAlive && hasSpecial(attackerDef,'seifuku')){
      attacker.atk += 3;
      drawCard(attackerOwner, 1);
      log(`${attackerOwner.name}の「${attackerDef.name}」は征服の力でATK+3、カードを1枚引いた。`);
    }
    // 進軍: defeating an enemy person lets this card attack again this turn
    if(wasPerson && diedNow && attackerStillAlive && hasSpecial(attackerDef,'shingun')){
      attacker.attacked = false;
      log(`${attackerOwner.name}の「${attackerDef.name}」は進軍により再び攻撃できる！`);
    }
    log(`${attackerOwner.name}の「${attackerDef.name}」が攻撃した。`);
    gainWlp(attackerOwner, 10);
    // 王権: the first time this card attacks, it also grants WLP+10 (a king's decree)
    if(hasSpecial(attackerDef,'ouken') && attackerStillAlive && !attacker.usedOuken){
      attacker.usedOuken = true;
      gainWlp(attackerOwner, 10);
      log(`${attackerOwner.name}の「${attackerDef.name}」の王権が発動！WLP+10。`);
    }
  }
}

function checkGameOver(){
  if(state.gameOver) return;
  if(state.player.coreHp<=0){
    state.gameOver = true;
    log('=== あなたのCoreが崩壊した。敗北。===');
    showGameOverModal(false);
  } else if(state.ai.coreHp<=0){
    state.gameOver = true;
    log('=== 相手のCoreを撃破した！勝利！===');
    showGameOverModal(true);
  }
}

function resetToTitle(){

  state.active = 'player';
  state.player = newPlayerState('あなた');
  state.ai = newPlayerState('相手');
